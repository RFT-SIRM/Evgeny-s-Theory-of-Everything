name: Higher-moment diagnostic checks

on:
  push:
    paths:
      - "computational/diagnose_corner_moments.py"
      - "computational/independent_sparse_level7.py"
      - "computational/audit_trace_composition_exact.py"
      - "computational/audit_corner_neighbourhoods.py"
      - "computational/audit_operator_corner_labels.py"
      - "computational/CORNER_LOCALITY_LEMMA.md"
      - "computational/data/corner_neighbourhood_audit.json"
      - "computational/data/operator_corner_label_audit.json"
      - "computational/data/corner_moment_diagnostic_summary.json"
      - "computational/data/trace_composition_exact_audit.json"
      - "computational/data/corner_moment_full_recheck.json"
      - ".github/workflows/higher-moment-diagnostics.yml"
  pull_request:
    paths:
      - "computational/diagnose_corner_moments.py"
      - "computational/independent_sparse_level7.py"
      - "computational/audit_trace_composition_exact.py"
      - "computational/audit_corner_neighbourhoods.py"
      - "computational/audit_operator_corner_labels.py"
      - "computational/CORNER_LOCALITY_LEMMA.md"
      - "computational/data/corner_moment_diagnostic_summary.json"
      - "computational/data/trace_composition_exact_audit.json"
      - "computational/data/corner_neighbourhood_audit.json"
      - "computational/data/operator_corner_label_audit.json"
      - "computational/data/corner_moment_full_recheck.json"
      - ".github/workflows/higher-moment-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy sympy networkx
      - name: Run corner moment diagnostic
        run: python computational/diagnose_corner_moments.py --output artifacts/corner_moment_diagnostic.json
      - name: Run exact trace-composition audit
        run: python computational/audit_trace_composition_exact.py
      - name: Audit labelled corner neighbourhoods
        run: python computational/audit_corner_neighbourhoods.py --output artifacts/corner_neighbourhood_audit.json
      - name: Audit directed operator corner labels
        run: python computational/audit_operator_corner_labels.py --output artifacts/operator_corner_label_audit.json
      - name: Check exact audit and diagnostic invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          corner = json.loads(Path("artifacts/corner_moment_diagnostic.json").read_text())
          assert all(corner["checks"].values()), corner["checks"]
          assert corner["levels"] == [3, 4, 5, 6]
          assert corner["powers"] == list(range(1, 10))
          assert len(corner["angles"]) == 10

          exact = json.loads(Path("artifacts/trace_composition_exact_audit.json").read_text())
          assert exact["commutator_nonzero"] is True
          assert set(exact["powers"]) == {str(p) for p in range(1, 11)}
          assert all(exact["powers"][str(p)]["difference_exact"] == "0" for p in range(1, 11))
          assert all(exact["powers"][str(p)]["lhs_exact"] == exact["powers"][str(p)]["rhs_exact"] for p in range(1, 11))

          operator_labels = json.loads(Path("artifacts/operator_corner_label_audit.json").read_text())
          assert operator_labels["levels"] == [3, 4, 5, 6, 7, 8, 9, 10]
          assert operator_labels["radius"] == 4
          assert all(operator_labels["checks"].values()), operator_labels["checks"]
          committed_operator_labels = json.loads(Path("computational/data/operator_corner_label_audit.json").read_text())
          assert committed_operator_labels["levels"] == operator_labels["levels"]
          assert committed_operator_labels["radius"] == operator_labels["radius"]
          assert committed_operator_labels["checks"] == operator_labels["checks"]
          for model in operator_labels["models"]:
              for corner in operator_labels["models"][model]:
                  for level in map(str, operator_labels["levels"]):
                      actual = operator_labels["models"][model][corner]["levels"][level]
                      stored = committed_operator_labels["models"][model][corner]["levels"][level]
                      assert actual == stored, (model, corner, level, actual, stored)
          assert all(committed_operator_labels["checks"].values()), committed_operator_labels["checks"]
          print("Directed operator label audit passed:", operator_labels["checks"])

          neighbourhood = json.loads(Path("artifacts/corner_neighbourhood_audit.json").read_text())
          assert all(neighbourhood["checks"].values()), neighbourhood["checks"]
          assert neighbourhood["levels"] == [3, 4, 5, 6]
          assert neighbourhood["radius"] == 4

          committed_corner = json.loads(Path("computational/data/corner_moment_diagnostic_summary.json").read_text())
          assert committed_corner["checks"]["diagonal_blocks_identical_in_computed_arrays"] is True
          assert committed_corner["checks"]["off_diagonal_first_nonzero_power_8"] is True

          committed_exact = json.loads(Path("computational/data/trace_composition_exact_audit.json").read_text())
          assert all(committed_exact["powers"][str(p)]["difference_exact"] == "0" for p in range(1, 11))
          for p in range(1, 11):
              assert exact["powers"][str(p)]["lhs_exact"] == committed_exact["powers"][str(p)]["lhs_exact"]
              assert exact["powers"][str(p)]["rhs_exact"] == committed_exact["powers"][str(p)]["rhs_exact"]
              assert exact["powers"][str(p)]["composition_terms_by_r"] == committed_exact["powers"][str(p)]["composition_terms_by_r"]
          full_corner = json.loads(Path("computational/data/corner_moment_full_recheck.json").read_text())
          assert full_corner["checks"]["all_diagonal_blocks_identical_across_levels_for_powers_1_to_9"] is True
          assert full_corner["checks"]["offdiagonal_blocks_first_nonzero_power_8_on_level_3"] is True
          print("All higher-moment diagnostic checks passed.")
          PY
      - name: Upload generated diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: higher-moment-diagnostics
          path: artifacts/*.json
          if-no-files-found: error
