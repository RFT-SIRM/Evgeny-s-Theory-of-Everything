name: Lean formalization build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out synthesis repository
        uses: actions/checkout@v4
      - name: Check out pinned formalization source
        uses: actions/checkout@v4
        with:
          repository: RFT-SIRM/Evgeny-Theorem
          ref: f2d0669066e45e0bf8525bd0b4caf27177986805
          path: Evgeny-Theorem
      - name: Build Lean formalization with pinned toolchain and Mathlib
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Evgeny-Theorem
          use-mathlib-cache: true
          build: true
          test: false
