name: Higher-moment angle-grid holdout

on:
  push:
    branches: [main]
    paths:
      - "computational/compute_higher_moment_angle_grid.py"
      - ".github/workflows/higher-moment-angle-grid.yml"
  pull_request:
    branches: [main]
    paths:
      - "computational/compute_higher_moment_angle_grid.py"
      - ".github/workflows/higher-moment-angle-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angle-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned operator source
        uses: actions/checkout@v4
        with:
          repository: RFT-SIRM/Evgeny-Theorem
          ref: 9ed32ae27b4493945624c2911d2815059613a9f5
          path: Evgeny-Theorem
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compute holdout over angle grid
        run: |
          python computational/compute_higher_moment_angle_grid.py \
            --source-root Evgeny-Theorem \
            --output artifacts/higher_moment_angle_grid.json
      - name: Upload angle-grid report
        if: always() && hashFiles('artifacts/higher_moment_angle_grid.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: higher-moment-angle-grid
          path: artifacts/higher_moment_angle_grid.json
