name: Exact modular certificate for higher-moment coefficients
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modular-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install "numpy>=1.24,<3" "scipy>=1.10,<2"
      - name: Check Python syntax before numerical verification
        run: python -m py_compile computational/verify_higher_moment_coefficients_modular.py
      - name: Verify Fourier coefficients over three finite fields and CRT bounds
        run: python computational/verify_higher_moment_coefficients_modular.py --output artifacts/higher_moment_modular_certificate.json
      - name: Check H10 certificate Python syntax
        run: python -m py_compile computational/h10_level5_residual_certificate.py computational/test_h10_level5_residual_certificate.py
      - name: Verify exact H10 level-five correction
        run: python -m computational.h10_level5_residual_certificate --output artifacts/h10_level5_residual_certificate.json
      - name: Run exact H10 regression tests
        run: python -m unittest computational.test_h10_level5_residual_certificate -v
      - name: Upload exact higher-moment certificates
        if: always() && hashFiles('artifacts/higher_moment_modular_certificate.json', 'artifacts/h10_level5_residual_certificate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: higher-moment-exact-certificates
          path: |
            artifacts/higher_moment_modular_certificate.json
            artifacts/h10_level5_residual_certificate.json
