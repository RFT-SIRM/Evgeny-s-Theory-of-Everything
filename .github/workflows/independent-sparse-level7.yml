name: Independent sparse higher-moment holdout through level 7
on:
  push:
    branches: [main]
    paths:
      - "computational/independent_sparse_level7.py"
      - ".github/workflows/independent-sparse-level7.yml"
  pull_request:
    branches: [main]
    paths:
      - "computational/independent_sparse_level7.py"
      - ".github/workflows/independent-sparse-level7.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sparse-level7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install "numpy>=1.24,<3" "scipy>=1.10,<2"
      - name: Run independent sparse trace holdout
        run: python computational/independent_sparse_level7.py --output artifacts/independent_sparse_level7.json
      - name: Upload sparse holdout report
        if: always() && hashFiles('artifacts/independent_sparse_level7.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: independent-sparse-higher-moment-level7
          path: artifacts/independent_sparse_level7.json
