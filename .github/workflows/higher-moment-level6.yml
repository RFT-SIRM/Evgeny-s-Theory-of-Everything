name: Higher-moment level-6 holdout

on:
  push:
    branches: [main]
    paths:
      - "computational/compute_higher_moment_level6.py"
      - ".github/workflows/higher-moment-level6.yml"
  pull_request:
    branches: [main]
    paths:
      - "computational/compute_higher_moment_level6.py"
      - ".github/workflows/higher-moment-level6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned operator source
        uses: actions/checkout@v4
        with:
          repository: RFT-SIRM/Evgeny-Theorem
          ref: 9ed32ae27b4493945624c2911d2815059613a9f5
          path: Evgeny-Theorem
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compute level-6 holdout at three angles
        run: |
          python computational/compute_higher_moment_level6.py \
            --source-root Evgeny-Theorem \
            --output artifacts/higher_moment_level6.json
      - name: Upload level-6 report
        if: always() && hashFiles('artifacts/higher_moment_level6.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: higher-moment-level6-holdout
          path: artifacts/higher_moment_level6.json
