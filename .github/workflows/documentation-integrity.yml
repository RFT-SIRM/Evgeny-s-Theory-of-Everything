name: Documentation and reference audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-arithmetic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation structure and provenance
        run: python scripts/check_docs.py
      - name: Print recurrence arithmetic audit
        run: python computational/audit_recurrence.py
      - name: Test recurrence arithmetic audit
        run: python -m unittest discover -s tests -p 'test_reference_recurrence_audit.py' -v
